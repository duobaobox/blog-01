# 这是留给最终用户（部署者）的发布版 compose
# 默认管理员账号会在首次访问 /admin/login 时自动准备

services:
  blog:
    # 本地导入镜像后默认直接使用 blog-01-app:release
    # 如果后续切 Docker Hub，可在 .env 中覆盖 APP_IMAGE
    image: ${APP_IMAGE:-blog-01-app:release}
    container_name: blog-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - RUN_DB_PUSH=${RUN_DB_PUSH:-1}
      - DATABASE_URL=postgresql://blog:${POSTGRES_PASSWORD:-change-this-db-password}@db:5432/blog?schema=public
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-this-secret}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-}
      - SITE_URL=${SITE_URL:-http://localhost:3000}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME:-Admin}
      - SEED_ADMIN_USERNAME=${SEED_ADMIN_USERNAME:-admin}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@example.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin123456}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/public/media # Docker 自动管理站点媒体库，无需额外配置路径

  db:
    image: postgres:16
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
      POSTGRES_DB: blog
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  media_data:
