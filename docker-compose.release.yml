services:
  blog:
    image: ${APP_IMAGE:-ghcr.io/duobaobox/blog-01}:${BLOG_VERSION:-latest}
    pull_policy: always
    container_name: blog-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DB_SCHEMA_SYNC_MODE: ${DB_SCHEMA_SYNC_MODE:-auto}
      PRISMA_SCHEMA_PATH: /app/prisma/schema.prisma
      DATABASE_URL: postgresql://blog:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/blog?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:?ADMIN_SETUP_TOKEN is required}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_PROTOCOL: ${AI_PROTOCOL:-chat-completions}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-30000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/public/media
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16
    pull_policy: missing
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: blog
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  media_data:
