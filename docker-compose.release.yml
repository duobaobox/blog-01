# 这是留给最终用户（部署者）的发布版 compose
# 默认管理员账号会在首次访问 /admin/login 时自动准备

services:
  blog:
    # 这里的 image 请替换为你推送到 Docker Hub 上的实际地址，例如：
    # image: your-dockerhub-username/blog-01:latest
    image: blog-01:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    command: ["sh", "-c", "npm run db:push && npm start"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://blog:${POSTGRES_PASSWORD:-change-this-db-password}@db:5432/blog?schema=public
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-this-secret}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - SITE_URL=${SITE_URL:-http://localhost:3000}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME:-Admin}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@example.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin123456}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/public/media # Docker 自动管理站点媒体库，无需额外配置路径

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
      POSTGRES_DB: blog
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  media_data:
