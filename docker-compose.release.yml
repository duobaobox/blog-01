# 这是留给最终用户（部署者）的发布版 compose
# 生产初始化通过 /admin/setup + ADMIN_SETUP_TOKEN 创建自定义管理员

services:
  blog:
    # 本地导入镜像后默认直接使用 blog-01-app:release
    # 如果后续切 Docker Hub，可在 .env 中覆盖 APP_IMAGE
    image: ${APP_IMAGE:-blog-01-app:release}
    container_name: blog-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DB_SCHEMA_SYNC_MODE=${DB_SCHEMA_SYNC_MODE:-auto}
      - PRISMA_SCHEMA_PATH=/app/prisma/schema.prisma
      - DATABASE_URL=postgresql://blog:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/blog?schema=public
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-}
      - SITE_URL=${SITE_URL:?SITE_URL is required}
      - ADMIN_SETUP_TOKEN=${ADMIN_SETUP_TOKEN:?ADMIN_SETUP_TOKEN is required}
      # 默认使用 Docker 持久化卷中的本地媒体库；不要把上传文件留在容器可写层。
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/public/media # Docker 自动管理站点媒体库，无需额外配置路径
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db:
    image: postgres:16
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: blog
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  media_data:
