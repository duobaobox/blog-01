name: blog-01-offline

x-app-environment: &app-environment
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  PORT: 3000
  DATABASE_URL: postgresql://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD:-blog}@db:5432/${POSTGRES_DB:-blog}?schema=public
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
  ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
  SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123456}

services:
  app:
    image: ${APP_IMAGE:-blog-01-app:latest}
    container_name: blog-app
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/public/uploads

  migrate:
    image: ${APP_IMAGE:-blog-01-app:latest}
    profiles: ["tools"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:push"]
    volumes:
      - uploads_data:/app/public/uploads

  seed:
    image: ${APP_IMAGE:-blog-01-app:latest}
    profiles: ["tools"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:seed"]
    volumes:
      - uploads_data:/app/public/uploads

  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-blog} -d ${POSTGRES_DB:-blog}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads_data:
