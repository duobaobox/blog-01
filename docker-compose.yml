name: blog-01

x-app-environment: &app-environment
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  PORT: 3000
  DB_SCHEMA_SYNC_MODE: ${DB_SCHEMA_SYNC_MODE:-auto}
  PRISMA_SCHEMA_PATH: /app/prisma/schema.prisma
  DATABASE_URL: postgresql://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-blog}?schema=public
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
  BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
  SITE_URL: ${SITE_URL:?SITE_URL is required}
  ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:?ADMIN_SETUP_TOKEN is required}
  SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
  SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123456}
  AI_ENABLED: ${AI_ENABLED:-false}
  AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
  AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_PROTOCOL: ${AI_PROTOCOL:-chat-completions}
  AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
  AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-30000}

services:
  app:
    image: ${APP_IMAGE:-blog-01-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: blog-app
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./media:/app/public/media
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  migrate:
    image: ${APP_IMAGE:-blog-01-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    profiles: ["tools"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["/usr/local/bin/schema-sync.sh"]

  seed:
    image: ${APP_TOOLS_IMAGE:-blog-01-tools:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    profiles: ["tools"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:seed"]

  seed-demo-posts:
    image: ${APP_TOOLS_IMAGE:-blog-01-tools:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    profiles: ["tools"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "tsx", "prisma/seed-demo-posts.ts"]

  db:
    image: postgres:16
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-blog} -d ${POSTGRES_DB:-blog}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
