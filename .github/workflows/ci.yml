name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://blog:ci-database-password-2026@127.0.0.1:5432/blog?schema=public
      BETTER_AUTH_SECRET: ci-auth-secret-with-more-than-thirty-two-characters-2026
      BETTER_AUTH_URL: http://localhost:3000
      SITE_URL: http://localhost:3000
      ADMIN_SETUP_TOKEN: ci-setup-token-2026
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: ci-database-password-2026
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma Client
        run: npm run db:generate

      - name: 应用数据库迁移
        run: npx prisma migrate deploy

      - name: 代码检查
        run: npm run lint

      - name: 运行测试
        run: npm test

      - name: 构建应用
        run: npm run build
