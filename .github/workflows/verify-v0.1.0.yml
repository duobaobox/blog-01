name: Verify v0.1.0 Release

on:
  push:
    branches: [main]
    paths:
      - ".github/verify-v0.1.0"

permissions:
  actions: read
  contents: write
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SHA: 4d8c1cd3e3b482d05f4473c6614ffddc65cb96cd
      RELEASE_TAG: v0.1.0
      IMAGE: ghcr.io/duobaobox/blog-01:0.1.0
      REPORT: .github/release-v0.1.0-report.txt

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 等待并验证正式发行
        id: verify
        continue-on-error: true
        run: |
          set -uo pipefail

          : > "$REPORT"
          echo "release_tag=$RELEASE_TAG" >> "$REPORT"
          echo "target_sha=$TARGET_SHA" >> "$REPORT"
          echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$REPORT"

          run_id=""
          for attempt in $(seq 1 100); do
            runs_json="$(gh run list \
              --workflow release.yml \
              --limit 30 \
              --json databaseId,headBranch,headSha,status,conclusion,url,createdAt 2>/dev/null || printf '[]')"

            run_id="$(printf '%s' "$runs_json" | jq -r \
              --arg sha "$TARGET_SHA" \
              '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | last | .databaseId // empty')"

            if [[ -n "$run_id" ]]; then
              run_status="$(gh run view "$run_id" --json status --jq .status 2>/dev/null || true)"
              if [[ "$run_status" == "completed" ]]; then
                break
              fi
            fi

            sleep 15
          done

          if [[ -z "$run_id" ]]; then
            echo "verification=failed" >> "$REPORT"
            echo "reason=release workflow run was not found" >> "$REPORT"
            exit 1
          fi

          gh run view "$run_id" \
            --json databaseId,status,conclusion,url,headSha,jobs \
            > /tmp/release-run.json

          echo "run_id=$run_id" >> "$REPORT"
          echo "run_status=$(jq -r .status /tmp/release-run.json)" >> "$REPORT"
          echo "run_conclusion=$(jq -r .conclusion /tmp/release-run.json)" >> "$REPORT"
          echo "run_url=$(jq -r .url /tmp/release-run.json)" >> "$REPORT"
          echo "jobs:" >> "$REPORT"
          jq -r '.jobs[] | "  - " + .name + ": " + (.conclusion // .status)' /tmp/release-run.json >> "$REPORT"

          conclusion="$(jq -r .conclusion /tmp/release-run.json)"
          if [[ "$conclusion" != "success" ]]; then
            echo "verification=failed" >> "$REPORT"
            echo "failed_logs:" >> "$REPORT"
            gh run view "$run_id" --log-failed 2>&1 | tail -n 250 | sed 's/^/  /' >> "$REPORT" || true
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" \
            --json tagName,name,isDraft,isPrerelease,url,publishedAt,assets \
            > /tmp/release.json; then
            echo "verification=failed" >> "$REPORT"
            echo "reason=GitHub Release was not found" >> "$REPORT"
            exit 1
          fi

          echo "release_url=$(jq -r .url /tmp/release.json)" >> "$REPORT"
          echo "release_draft=$(jq -r .isDraft /tmp/release.json)" >> "$REPORT"
          echo "release_prerelease=$(jq -r .isPrerelease /tmp/release.json)" >> "$REPORT"
          echo "release_published_at=$(jq -r .publishedAt /tmp/release.json)" >> "$REPORT"
          echo "assets:" >> "$REPORT"
          jq -r '.assets[] | "  - " + .name + " (" + (.size | tostring) + " bytes)"' /tmp/release.json >> "$REPORT"

          rm -rf /tmp/blog-01-release
          mkdir -p /tmp/blog-01-release
          gh release download "$RELEASE_TAG" \
            --dir /tmp/blog-01-release \
            --pattern 'blog-01-linux-amd64.tar.gz*'

          if (
            cd /tmp/blog-01-release
            sha256sum -c blog-01-linux-amd64.tar.gz.sha256
          ); then
            echo "release_asset_checksum=success" >> "$REPORT"
          else
            echo "release_asset_checksum=failed" >> "$REPORT"
            echo "verification=failed" >> "$REPORT"
            exit 1
          fi

          rm -rf /tmp/docker-auth /tmp/docker-anonymous
          mkdir -p /tmp/docker-auth /tmp/docker-anonymous

          if printf '%s' "$GH_TOKEN" | DOCKER_CONFIG=/tmp/docker-auth docker login ghcr.io \
            -u "${GITHUB_ACTOR}" \
            --password-stdin >/dev/null 2>&1 \
            && DOCKER_CONFIG=/tmp/docker-auth docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "authenticated_image_manifest=success" >> "$REPORT"
          else
            echo "authenticated_image_manifest=failed" >> "$REPORT"
            echo "verification=failed" >> "$REPORT"
            exit 1
          fi

          if DOCKER_CONFIG=/tmp/docker-anonymous docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "anonymous_image_manifest=success" >> "$REPORT"
          else
            echo "anonymous_image_manifest=failed" >> "$REPORT"
            echo "package_visibility_action=Set the GHCR package visibility to Public" >> "$REPORT"
          fi

          echo "verification=success" >> "$REPORT"

      - name: 写入验收报告
        if: always()
        run: |
          set -euo pipefail

          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "记录 v0.1.0 在线发行验收结果"
          git push origin HEAD:main

      - name: 确认验收结果
        if: steps.verify.outcome == 'failure'
        run: exit 1
