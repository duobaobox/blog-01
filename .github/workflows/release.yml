name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: 发版前检查
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://blog:release-database-password-2026@127.0.0.1:5432/blog?schema=public
      BETTER_AUTH_SECRET: release-auth-secret-with-more-than-thirty-two-characters-2026
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      SITE_URL: http://localhost:3000
      ADMIN_SETUP_TOKEN: release-setup-token-2026
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: release-database-password-2026
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 检出版本代码
        uses: actions/checkout@v6

      - name: 校验版本标签
        run: |
          if ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            echo "Expected a semantic version such as v0.1.0 or v0.1.0-rc.1." >&2
            exit 1
          fi

      - name: 校验交付脚本
        run: |
          bash -n install.sh
          bash -n delivery/release/install.sh
          bash -n delivery/release/blogctl
          bash -n scripts/release/build-release-bundle.sh
          docker compose --env-file .env.release.example -f docker-compose.release.yml config >/dev/null

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma Client
        run: npm run db:generate

      - name: 应用数据库迁移
        run: npx prisma migrate deploy

      - name: 代码检查
        run: npm run lint

      - name: 运行测试
        run: npm test

      - name: 构建应用
        run: npm run build

      - name: 验证服务器安装包
        run: |
          bash scripts/release/build-release-bundle.sh "${GITHUB_REF_NAME#v}"
          (
            cd dist
            sha256sum -c blog-01-linux-amd64.tar.gz.sha256
          )

  publish:
    name: 发布 AMD64 镜像与安装包
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出版本代码
        uses: actions/checkout@v6

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与 OCI 元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Blog-01
            org.opencontainers.image.description=Self-hosted Next.js blog system
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.licenses=MIT

      - name: 构建并推送 AMD64 镜像
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 证明容器镜像来源
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: 生成服务器安装包
        run: bash scripts/release/build-release-bundle.sh "${GITHUB_REF_NAME#v}"

      - name: 证明安装包来源
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/blog-01-linux-amd64.tar.gz
            dist/blog-01-linux-amd64.tar.gz.sha256

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASE_FLAGS=(
            --verify-tag
            --generate-notes
            --title "Blog-01 ${GITHUB_REF_NAME}"
          )

          if printf '%s' "${GITHUB_REF_NAME}" | grep -q '-'; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          else
            RELEASE_FLAGS+=(--latest)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            dist/blog-01-linux-amd64.tar.gz \
            dist/blog-01-linux-amd64.tar.gz.sha256 \
            "${RELEASE_FLAGS[@]}"
