name: Release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic version tag, for example v0.1.0
        required: true
        type: string
      target_ref:
        description: Git ref to build, normally the same version tag
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}

jobs:
  verify:
    name: 发版前检查
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      release_sha: ${{ steps.release_commit.outputs.sha }}
      release_sha_short: ${{ steps.release_commit.outputs.short_sha }}
    env:
      DATABASE_URL: postgresql://blog:release-database-password-2026@127.0.0.1:5432/blog?schema=public
      BETTER_AUTH_SECRET: release-auth-secret-with-more-than-thirty-two-characters-2026
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      SITE_URL: http://localhost:3000
      ADMIN_SETUP_TOKEN: release-setup-token-2026
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: release-database-password-2026
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 检出版本代码
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: 校验版本标签
        run: |
          set -euo pipefail

          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            echo "Expected a semantic version such as v0.1.0 or v0.1.0-rc.1." >&2
            exit 1
          fi

          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null

      - name: 记录发行提交
        id: release_commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: 校验交付脚本
        run: |
          bash -n install.sh
          bash -n delivery/release/install.sh
          bash -n delivery/release/blogctl
          bash -n scripts/release/build-release-bundle.sh
          docker compose --env-file .env.release.example -f docker-compose.release.yml config >/dev/null

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma Client
        run: npm run db:generate

      - name: 应用数据库迁移
        run: npx prisma migrate deploy

      - name: 代码检查
        run: npm run lint

      - name: 运行测试
        run: npm test

      - name: 构建应用
        run: npm run build

      - name: 验证服务器安装包
        run: |
          bash scripts/release/build-release-bundle.sh "${RELEASE_TAG#v}"
          (
            cd dist
            sha256sum -c blog-01-linux-amd64.tar.gz.sha256
          )

  publish:
    name: 发布 AMD64 镜像与安装包
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出版本代码
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与 OCI 元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}
            type=raw,value=sha-${{ needs.verify.outputs.release_sha_short }}
          labels: |
            org.opencontainers.image.title=Blog-01
            org.opencontainers.image.description=Self-hosted Next.js blog system
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.revision=${{ needs.verify.outputs.release_sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=MIT

      - name: 构建并推送 AMD64 镜像
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 证明容器镜像来源
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: 生成服务器安装包
        run: bash scripts/release/build-release-bundle.sh "${RELEASE_TAG#v}"

      - name: 证明安装包来源
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/blog-01-linux-amd64.tar.gz
            dist/blog-01-linux-amd64.tar.gz.sha256
            dist/blog-01-installer.sh
            dist/blog-01-installer.sh.sha256

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASE_FLAGS=(
            --verify-tag
            --generate-notes
            --title "Blog-01 ${RELEASE_TAG}"
          )

          if printf '%s' "$RELEASE_TAG" | grep -q '-'; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          else
            RELEASE_FLAGS+=(--latest)
          fi

          gh release create "$RELEASE_TAG" \
            dist/blog-01-linux-amd64.tar.gz \
            dist/blog-01-linux-amd64.tar.gz.sha256 \
            dist/blog-01-installer.sh \
            dist/blog-01-installer.sh.sha256 \
            "${RELEASE_FLAGS[@]}"
