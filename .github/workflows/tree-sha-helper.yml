name: Install Home Scene PNGs

on:
  push:
    branches: [upload-home-scenes]
    paths:
      - ".scene-payload/READY"

permissions:
  contents: write

jobs:
  install-scenes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out payload branch
        uses: actions/checkout@v4
        with:
          ref: upload-home-scenes
          fetch-depth: 0

      - name: Rebuild transparent PNG assets
        run: |
          python -m pip install --quiet pillow
          mkdir -p /tmp/home-scenes
          python - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image

          names = [
              "day-work",
              "day-break",
              "day-window",
              "night-work",
              "night-sleep",
          ]
          payload = Path(".scene-payload")
          output = Path("/tmp/home-scenes")
          for name in names:
              webp_path = output / f"{name}.webp"
              png_path = output / f"{name}.png"
              webp_path.write_bytes(base64.b64decode((payload / f"{name}.webp.b64").read_text()))
              with Image.open(webp_path) as image:
                  image.convert("RGBA").save(png_path, format="PNG")
          PY

      - name: Commit PNG assets to main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p public/home/scenes
          cp /tmp/home-scenes/*.png public/home/scenes/
          rm -f .github/workflows/tree-sha-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/home/scenes .github/workflows/tree-sha-helper.yml
          git commit -m "资源：首页替换为原始透明 PNG 场景图"
          git push origin main
          git push origin --delete upload-home-scenes || true
