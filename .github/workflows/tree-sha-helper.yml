name: Tree SHA Helper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  report-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Report base commit and tree
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "BASE_COMMIT=$BASE_SHA"
          curl --silent --fail \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/git/commits/$BASE_SHA" \
            | python -c 'import json, sys; print("BASE_TREE=" + json.load(sys.stdin)["tree"]["sha"])'
