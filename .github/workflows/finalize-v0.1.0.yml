name: Finalize v0.1.0 Release

on:
  push:
    branches: [main]
    paths:
      - ".github/finalize-v0.1.0"

permissions:
  actions: read
  contents: write
  packages: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_RUN_ID: "30252821577"
      RELEASE_TAG: v0.1.0
      IMAGE: ghcr.io/duobaobox/blog-01:0.1.0
      REPORT: .github/release-v0.1.0-final.txt

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 验证 Release、安装资产与 GHCR
        run: |
          set -euo pipefail

          : > "$REPORT"
          echo "release_tag=$RELEASE_TAG" >> "$REPORT"
          echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$REPORT"

          gh run view "$RELEASE_RUN_ID" \
            --json databaseId,status,conclusion,url,jobs,displayTitle \
            > /tmp/release-run.json

          conclusion="$(jq -r .conclusion /tmp/release-run.json)"
          echo "run_id=$RELEASE_RUN_ID" >> "$REPORT"
          echo "run_title=$(jq -r .displayTitle /tmp/release-run.json)" >> "$REPORT"
          echo "run_status=$(jq -r .status /tmp/release-run.json)" >> "$REPORT"
          echo "run_conclusion=$conclusion" >> "$REPORT"
          echo "run_url=$(jq -r .url /tmp/release-run.json)" >> "$REPORT"
          echo "jobs:" >> "$REPORT"
          jq -r '.jobs[] | "  - " + .name + ": " + (.conclusion // .status)' /tmp/release-run.json >> "$REPORT"

          [[ "$conclusion" == "success" ]]

          gh release view "$RELEASE_TAG" \
            --json tagName,name,isDraft,isPrerelease,url,publishedAt,assets \
            > /tmp/release.json

          echo "release_url=$(jq -r .url /tmp/release.json)" >> "$REPORT"
          echo "release_draft=$(jq -r .isDraft /tmp/release.json)" >> "$REPORT"
          echo "release_prerelease=$(jq -r .isPrerelease /tmp/release.json)" >> "$REPORT"
          echo "release_published_at=$(jq -r .publishedAt /tmp/release.json)" >> "$REPORT"
          echo "assets:" >> "$REPORT"
          jq -r '.assets[] | "  - " + .name + " (" + (.size | tostring) + " bytes)"' /tmp/release.json >> "$REPORT"

          rm -rf /tmp/blog-01-release
          mkdir -p /tmp/blog-01-release
          gh release download "$RELEASE_TAG" \
            --dir /tmp/blog-01-release \
            --pattern 'blog-01-linux-amd64.tar.gz*'

          (
            cd /tmp/blog-01-release
            sha256sum -c blog-01-linux-amd64.tar.gz.sha256
          )
          echo "release_asset_checksum=success" >> "$REPORT"

          rm -rf /tmp/docker-auth /tmp/docker-anonymous
          mkdir -p /tmp/docker-auth /tmp/docker-anonymous

          printf '%s' "$GH_TOKEN" | DOCKER_CONFIG=/tmp/docker-auth docker login ghcr.io \
            -u "${GITHUB_ACTOR}" \
            --password-stdin >/dev/null 2>&1
          DOCKER_CONFIG=/tmp/docker-auth docker manifest inspect "$IMAGE" >/dev/null
          echo "authenticated_image_manifest=success" >> "$REPORT"

          if DOCKER_CONFIG=/tmp/docker-anonymous docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "anonymous_image_manifest=success" >> "$REPORT"
          else
            echo "anonymous_image_manifest=failed" >> "$REPORT"
            echo "package_visibility_action=Set the GHCR package visibility to Public" >> "$REPORT"
          fi

          echo "verification=success" >> "$REPORT"

      - name: 写入最终验收报告
        run: |
          set -euo pipefail

          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git commit -m "记录 v0.1.0 最终发行验收"
          git push origin HEAD:main
